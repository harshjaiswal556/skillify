
    <!-- <form #form1="ngForm" (ngSubmit)="sendEmail($event)" novalidate> -->
    <form #form1="ngForm" (ngSubmit)="save(form1.value, $event)" novalidate>
        <div class="mb-3">
            <label for="exampleFormControlName1" class="form-label">Full Name*</label>
            <input type="text" name="name" class="form-control" [(ngModel)]="contact.name" #name="ngModel" id="exampleFormControlName1" required
                placeholder="Enter Your Name" pattern="^[a-zA-Z][a-zA-Z\s]*$" >
                <div *ngIf="(name.invalid && name.touched) || (form1.submitted && name.invalid)" class="text-danger">
                    Valid name is required.
                </div>
        </div>
        <div class="mb-3">
            <label for="exampleFormControlInput1" class="form-label">Email address*</label>
            <input type="email" name="email" class="form-control" [(ngModel)]="contact.email" #email="ngModel" id="exampleFormControlInput1" required
                placeholder="Enter Your Email">
                <div *ngIf="(email.invalid && email.touched)|| (form1.submitted && email.invalid)" class="text-danger">
                    Valid email is required.
                </div>
        </div>
        <div class="mb-3">
            <label for="exampleFormControlTextarea1" class="form-label">Message*</label>
            <textarea  name="message" class="form-control" [(ngModel)]="contact.message" #message="ngModel" id="exampleFormControlTextarea1" rows="3" required
                placeholder="Enter Your Message"></textarea>
                <div *ngIf="(message.invalid && message.touched) || (form1.submitted && message.invalid)" class="text-danger">
                    Message is required.
                </div>
        </div>
        <article>
            <input type="submit" value="Submit" style="margin-right: 10px;">
            <button type="button" class="address" data-bs-toggle="modal" data-bs-target="#exampleModal">
                Get Address
            </button>
        </article>

        <div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel"
            aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h1 class="modal-title fs-5" id="exampleModalLabel">Address</h1>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"
                            aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        Impelsys, Survey No. 192, IWF Campus, B Narayanpura, Mahadevpura, Bengaluru,
                        Karnataka - 560016
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-danger"
                            data-bs-dismiss="modal">Close</button>
                    </div>
                </div>
            </div>
        </div>
    </form>
