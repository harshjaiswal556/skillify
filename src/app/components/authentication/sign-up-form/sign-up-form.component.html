
<form [formGroup]="signUpForm" (ngSubmit)="signUpSubmit($event)" novalidate>
    <div class="mb-3">
        <label for="exampleFormControlName1" class="form-label">Full Name*</label>
        <input formControlName="name" name="name" type="text" class="form-control" placeholder="Enter Your Name" pattern="^[a-zA-Z][a-zA-Z\s]*$">
            <div *ngIf="(signUpForm.controls['name'].invalid) && (signUpForm.controls['name'].touched)" class="text-danger">
                Valid name is required.
            </div>
    </div>
    <div class="row">
        <div class="mb-3 col-md-6">
            <label for="exampleFormControlName1" class="form-label">Email ID*</label>
            <input formControlName="user" name="user" type="email" class="form-control" placeholder="Enter Your Email" >
                <div *ngIf="(signUpForm.controls['user'].invalid) && (signUpForm.controls['user'].touched)" class="text-danger">
                    Valid email is required.
                </div>
        </div>
        <div *ngIf="!role" class="mb-3 col-md-6">
            <label for="exampleFormControlInput1" class="form-label">Select Role*</label>
            <select class="form-select" aria-label="Default select example" formControlName="role">
                <option value="student">Student</option>
                <option value="faculty">Faculty</option>
            </select>
            <div *ngIf="(signUpForm.controls['role'].invalid) && (signUpForm.controls['role'].touched)" class="text-danger">
                Valid role is required.
            </div>
        </div>
    </div>
    <div class="row">
        <div class="mb-3 col-md-6">
            <label for="exampleFormControlInput1" class="form-label">Password*</label>
            <input type="password" formControlName="password" class="form-control"
                placeholder="Enter Your Password" minlength="8">
                <div *ngIf="(signUpForm.controls['password'].invalid) && (signUpForm.controls['password'].touched)" class="text-danger">
                    Valid password is required.
                </div>
        </div>
        <div class="mb-3 col-md-6">
            <label for="exampleFormControlInput1" class="form-label">Confirm Password*</label>
            <input type="password" formControlName="cPassword" class="form-control"
                placeholder="Enter Your Password" minlength="8">
                <div *ngIf="(signUpForm.controls['cPassword'].invalid) && (signUpForm.controls['cPassword'].touched)" class="text-danger">
                    Valid password is required.
                </div>
        </div>
    </div>

    <div class="row" *ngIf="!role">
        <div class="mb-3 col-md-6">
            <input type="password" class="form-control" name="message" formControlName="message" placeholder="Enter Your OTP">
        </div>
        <div class="mb-3 col-md-6">
            <input type="button" value="Generate OTP" style="padding: 5px 15px;" (click)="otp($event)" >
        </div>
    </div>
    <div class="mb-3">
        <a style="text-decoration: none; color: #4dc591;" routerLink="/login">Already have an account? Click here to login</a>
    </div>
    <article>
        <input type="submit" value="Submit" style="margin-right: 10px;" [disabled]="signUpForm.invalid" >
    </article>
</form>
