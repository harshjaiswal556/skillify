<div class="container d-flex align-items-start justify-content-between flex-column section">
    <h1 class="heading">
      <span class="highlight text-uppercase">Detailed Report</span>
    </h1>
    </div>
  
  <section>
    <article class="gallery-table">
        <table>
            <thead>
                <tr>
                    <th class="text-center p-3">S.No.</th>
                    <th class="text-center p-3">Student Name</th>
                    <th class="text-center p-3">Student Email</th>
                    <!-- <th class="text-center p-3">Published Date</th> -->
                    <th class="text-center p-3">Total Course</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let faculty of studentData; index as i">
                    <td class="text-center align-middle p-3">{{i+1}}</td>
                    <td class="text-center align-middle p-3">{{faculty.name}}</td>
                    <td class="text-center align-middle p-3">{{faculty.email}}</td>
                    <td *ngIf="faculty.course" class="text-center align-middle p-3">{{faculty.course.length}}</td>
                    <td *ngIf="!faculty.course" class="text-center align-middle p-3">0</td>
                </tr>
            </tbody>
        </table>
    </article>
  </section>
