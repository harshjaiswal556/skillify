<div class="container d-flex align-items-start justify-content-between flex-column section">
    <h1 class="heading">
      <span class="highlight text-uppercase">Detailed Report</span>
    </h1>
    </div>
  
  <section>
    <article class="gallery-table">
        <table>
            <thead>
                <tr>
                    <th class="text-center p-3">S.No.</th>
                    <th class="text-center p-3">Course Name</th>
                    <th class="text-center p-3">Duration(hrs)</th>
                    <th class="text-center p-3">Published Date</th>
                    <th class="text-center p-3">Total Students</th>
                    <th class="text-center p-3">Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let course of courseData; index as i">
                    <td class="text-center align-middle p-3" data-label="S.No.">{{i+1}}</td>
                    <td class="text-center align-middle p-3" data-label="Course Name">{{course.title}}</td>
                    <td class="text-center align-middle p-3" data-label="Duration(hrs)"> {{course.duration}} hrs</td>
                    <td class="text-center align-middle p-3" data-label="Published Date">{{course.date}}</td>
                    <td *ngIf="course.students" class="text-center align-middle p-3" data-label="Total Students">{{course.students.length}}</td>
                    <td *ngIf="!course.students" class="text-center align-middle p-3" data-label="Total Students">0</td>
                    <td class="text-center align-middle p-3">
                        <button style="margin: 0 8px;" mat-fab>
                            <mat-icon data-bs-toggle="modal" data-bs-target="#deleteModal" (click)="deleteCourseById(course.id)">delete</mat-icon>
                        </button>
                        <button style="margin: 0 8px;" mat-fab>
                            <mat-icon data-bs-toggle="modal" data-bs-target="#editCourse" (click)="editCourseById(course.title, course.duration, course.description, course.id)" >edit</mat-icon>
                        </button>
                    </td>
                </tr>
            </tbody>
        </table>
    </article>
  </section>


<div class="modal fade" id="editCourse" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header mb-3 d-flex col justify-content-between">
                <h1 class="modal-title fs-5" id="exampleModalLabel">Update Course</h1>
                <mat-icon class="close" data-bs-dismiss="modal" aria-label="Close">close</mat-icon>
            </div>
            <div class="modal-body">
                <app-add-course-form [title]="title" [duration]="duration" [description]="description" [id]="id" />
            </div>
        </div>
    </div>
</div>

<div class="modal" id="deleteModal" tabindex="-1" aria-labelledby="deleteModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Delete Course</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <p>Are you sure want to delete this course?</p>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-danger" (click)="deleteCourse()" >Delete Course</button>
        </div>
      </div>
    </div>
  </div>
