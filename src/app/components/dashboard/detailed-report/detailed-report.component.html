<div class="container d-flex align-items-start justify-content-between flex-column section">
  <h1 class="heading">
    <span class="highlight text-uppercase">Detailed Report</span>
  </h1>
  </div>

<section>
  <article class="gallery-table">
      <table>
          <thead>
              <tr>
                  <th class="text-center p-3">S.No.</th>
                  <th class="text-center p-3">Course Name</th>
                  <th class="text-center p-3">Duration</th>
                  <th class="text-center p-3">Purchase Date</th>
              </tr>
          </thead>
          <tbody>
              <tr *ngFor="let report of displayedData; index as i">
                  <td class="text-center align-middle p-3" data-label="S.No.">{{ (currentPage - 1) * pageSize + i + 1 }}</td>
                  <td class="text-center align-middle p-3" data-label="Course Name">{{report[0].title}}</td>
                  <td class="text-center align-middle p-3" data-label="Duration(hrs)">{{report[0].duration}} hrs</td>
                  <td class="text-center align-middle p-3" data-label="Purchase Date">{{courses[(currentPage - 1) * pageSize + i].date}}</td>
              </tr>
          </tbody>
      </table>
  </article>
  <div *ngIf="reports.length>pageSize" class="d-flex justify-content-center pagination">
    <button class="btn btn-outline-success custom-btn" (click)="prevPage()" [disabled]="currentPage === 1">Previous</button>
    <span>Page {{ currentPage }} of {{ totalPages }}</span>
    <button class="btn btn-outline-success custom-btn" (click)="nextPage()" [disabled]="currentPage === totalPages">Next</button>
  </div>
</section>
