<div class="fixed-top">
    <app-navbar/>
</div>

<div style="margin-top: 6rem;">
    <app-hero/>
</div>
    <app-about/>
    <div class="course">
        <div class="container d-flex align-items-center justify-content-between flex-column section">
            <h1 class="heading">
                Unlock Your<span class="highlight"> Coding</span> Potential
            </h1>
        </div>    
        <app-course [displayCoursesCount]=3 />
        <div class="custom-buttons d-flex mt-3 justify-content-center">
            <button class="btn btn-success course-btn mx-3" data-bs-toggle="modal" data-bs-target="#exampleModal">Explore More Courses</button>
            </div>

            <div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel"
            aria-hidden="true">
            <div class="modal-dialog bg-light p-3 border border-1 border-dark rounded">
                <app-add-course-form/>
                <button type="button" class="btn btn-danger"
                            data-bs-dismiss="modal">Close</button>
            </div>
        </div>
    </div>
<app-reviews/>
<app-footer/>
