<div class="fixed-top">
    <app-navbar />
</div>

<div style="margin-top: 6rem;">
    <app-hero />
</div>
<app-about />
<div class="course">
    <div class="container d-flex align-items-center justify-content-between flex-column section">
        <h1 class="heading">
            Unlock Your<span class="highlight"> Coding</span> Potential
        </h1>
    </div>
    <app-course [displayCoursesCount]=3 />
    <div class="custom-buttons d-flex mt-3 justify-content-center">
        <button class="btn btn-success course-btn mx-3" data-bs-toggle="modal" data-bs-target="#exampleModal">Explore
            More Courses</button>
    </div>

    <div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header mb-3 d-flex col justify-content-between">
                    <h1 class="modal-title fs-5" id="exampleModalLabel">Add Course</h1>
                    <mat-icon class="close" data-bs-dismiss="modal" aria-label="Close">close</mat-icon>
                </div>
                <div class="modal-body">
                    <app-add-course-form />
                </div>
            </div>
        </div>
    </div>
</div>
<app-reviews />
<app-footer />
